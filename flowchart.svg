<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrow-grn" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="1420" fill="#f8f9fa" rx="12"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Personal Trading Bot — How It Works</text>

  <!-- ===== STARTUP BLOCK ===== -->
  <!-- run.py -->
  <rect x="320" y="60" width="260" height="44" rx="8" fill="#2c3e50" stroke="#1a252f" stroke-width="1.5"/>
  <text x="450" y="87" text-anchor="middle" font-size="14" fill="white" font-weight="bold">run.py  (entry point)</text>

  <!-- arrow down -->
  <line x1="450" y1="104" x2="450" y2="128" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- mode diamond -->
  <polygon points="450,128 550,160 450,192 350,160" fill="#f39c12" stroke="#d68910" stroke-width="1.5"/>
  <text x="450" y="156" text-anchor="middle" font-size="13" fill="white" font-weight="bold">--paper</text>
  <text x="450" y="172" text-anchor="middle" font-size="13" fill="white" font-weight="bold">or --live?</text>

  <!-- paper branch left -->
  <line x1="350" y1="160" x2="200" y2="160" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow-grn)"/>
  <text x="270" y="152" text-anchor="middle" font-size="11" fill="#27ae60">--paper</text>

  <!-- paper box -->
  <rect x="90" y="138" width="112" height="44" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="146" y="157" text-anchor="middle" font-size="12" fill="white" font-weight="bold">PaperBroker</text>
  <text x="146" y="172" text-anchor="middle" font-size="11" fill="white">Synthetic data</text>

  <!-- live branch right -->
  <line x1="550" y1="160" x2="660" y2="160" stroke="#2980b9" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="603" y="152" text-anchor="middle" font-size="11" fill="#2980b9">--live</text>

  <!-- live box -->
  <rect x="660" y="138" width="140" height="44" rx="8" fill="#2980b9" stroke="#1a6a9e" stroke-width="1.5"/>
  <text x="730" y="157" text-anchor="middle" font-size="12" fill="white" font-weight="bold">CcxtBroker</text>
  <text x="730" y="172" text-anchor="middle" font-size="11" fill="white">+ IGBroker</text>

  <!-- both converge to LiveTrader -->
  <line x1="146" y1="182" x2="146" y2="240" stroke="#555" stroke-width="1.5"/>
  <line x1="146" y1="240" x2="390" y2="240" stroke="#555" stroke-width="1.5"/>
  <line x1="730" y1="182" x2="730" y2="240" stroke="#555" stroke-width="1.5"/>
  <line x1="730" y1="240" x2="510" y2="240" stroke="#555" stroke-width="1.5"/>
  <line x1="450" y1="192" x2="450" y2="240" stroke="#555" stroke-width="1.5"/>
  <line x1="450" y1="240" x2="450" y2="258" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- StateStore restore -->
  <rect x="590" y="258" width="170" height="38" rx="8" fill="#8e44ad" stroke="#6c3483" stroke-width="1.5"/>
  <text x="675" y="274" text-anchor="middle" font-size="12" fill="white" font-weight="bold">StateStore.restore()</text>
  <text x="675" y="288" text-anchor="middle" font-size="11" fill="white">reload kill-switch</text>
  <line x1="590" y1="277" x2="515" y2="277" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="550" y="270" text-anchor="middle" font-size="10" fill="#8e44ad">on startup</text>

  <!-- LiveTrader box -->
  <rect x="320" y="258" width="260" height="50" rx="8" fill="#1a5276" stroke="#154360" stroke-width="1.5"/>
  <text x="450" y="280" text-anchor="middle" font-size="14" fill="white" font-weight="bold">LiveTrader</text>
  <text x="450" y="298" text-anchor="middle" font-size="11" fill="#aed6f1">loop forever  (sleep timeframe)</text>

  <!-- ===== MAIN LOOP ===== -->
  <line x1="450" y1="308" x2="450" y2="332" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Venue.tick() -->
  <rect x="310" y="332" width="280" height="44" rx="8" fill="#1abc9c" stroke="#148f77" stroke-width="1.5"/>
  <text x="450" y="352" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Venue.tick()</text>
  <text x="450" y="368" text-anchor="middle" font-size="11" fill="white">per venue: crypto / metals</text>

  <!-- loop back arrow on left -->
  <path d="M310,354 Q240,354 240,680 Q240,740 310,740" fill="none" stroke="#1abc9c" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arrow-grn)"/>
  <text x="185" y="550" text-anchor="middle" font-size="11" fill="#1abc9c" transform="rotate(-90,185,550)">next cycle after sleep(timeframe)</text>

  <line x1="450" y1="376" x2="450" y2="400" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- data.fetch -->
  <rect x="300" y="400" width="300" height="50" rx="8" fill="#2471a3" stroke="#1a5276" stroke-width="1.5"/>
  <text x="450" y="421" text-anchor="middle" font-size="13" fill="white" font-weight="bold">data.fetch(market)</text>
  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#aed6f1">ccxt OHLCV  or  IG /prices</text>

  <!-- closed bar note -->
  <rect x="640" y="408" width="200" height="36" rx="6" fill="#f0f3f4" stroke="#aab7b8" stroke-width="1.2"/>
  <text x="740" y="424" text-anchor="middle" font-size="11" fill="#555">drop last (forming) bar</text>
  <text x="740" y="438" text-anchor="middle" font-size="11" fill="#555">→ trade closed bar only</text>
  <line x1="640" y1="425" x2="600" y2="425" stroke="#aab7b8" stroke-width="1.2" stroke-dasharray="4,3"/>

  <line x1="450" y1="450" x2="450" y2="474" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- maybe_new_day -->
  <rect x="310" y="474" width="280" height="44" rx="8" fill="#7d3c98" stroke="#6c3483" stroke-width="1.5"/>
  <text x="450" y="493" text-anchor="middle" font-size="13" fill="white" font-weight="bold">risk.maybe_new_day(equity)</text>
  <text x="450" y="509" text-anchor="middle" font-size="11" fill="#d7bde2">reset daily limit at midnight</text>

  <line x1="450" y1="518" x2="450" y2="542" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- strategy -->
  <rect x="300" y="542" width="300" height="50" rx="8" fill="#d35400" stroke="#b7460e" stroke-width="1.5"/>
  <text x="450" y="563" text-anchor="middle" font-size="13" fill="white" font-weight="bold">strategy(df)  →  signal</text>
  <text x="450" y="580" text-anchor="middle" font-size="11" fill="#fad7a0">trend / meanrev / breakout</text>

  <!-- strategy legend -->
  <rect x="640" y="542" width="220" height="70" rx="6" fill="#fef9e7" stroke="#f0d080" stroke-width="1.2"/>
  <text x="750" y="559" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">Strategies</text>
  <text x="750" y="575" text-anchor="middle" font-size="10" fill="#555">Trend: EMA 20/50 cross + 200 filter</text>
  <text x="750" y="589" text-anchor="middle" font-size="10" fill="#555">MeanRev: RSI(14) oversold bounce</text>
  <text x="750" y="603" text-anchor="middle" font-size="10" fill="#555">Breakout: Donchian 20-high + volume</text>
  <line x1="640" y1="568" x2="600" y2="568" stroke="#f0d080" stroke-width="1.2" stroke-dasharray="4,3"/>

  <line x1="450" y1="592" x2="450" y2="616" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===== ENGINE SECTION ===== -->
  <!-- Engine header -->
  <rect x="140" y="616" width="620" height="30" rx="6" fill="#2c3e50" opacity="0.12"/>
  <text x="450" y="636" text-anchor="middle" font-size="12" fill="#2c3e50" font-weight="bold">Engine.step()  —  risk gates then execution</text>

  <line x1="450" y1="646" x2="450" y2="666" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- daily limit diamond -->
  <polygon points="450,666 590,700 450,734 310,700" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="450" y="696" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Daily loss</text>
  <text x="450" y="712" text-anchor="middle" font-size="12" fill="white" font-weight="bold">limit hit?</text>

  <!-- yes branch -->
  <line x1="590" y1="700" x2="760" y2="700" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="670" y="693" text-anchor="middle" font-size="11" fill="#c0392b">YES  (≥5% drawdown)</text>
  <rect x="760" y="678" width="110" height="44" rx="8" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>
  <text x="815" y="697" text-anchor="middle" font-size="12" fill="white" font-weight="bold">HALT</text>
  <text x="815" y="712" text-anchor="middle" font-size="11" fill="white">flatten + stop</text>
  <!-- halt notify -->
  <line x1="815" y1="722" x2="815" y2="756" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="756" y="756" width="118" height="30" rx="6" fill="#f9ebea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="815" y="775" text-anchor="middle" font-size="11" fill="#c0392b">notify("HALT")</text>

  <!-- no branch -->
  <line x1="450" y1="734" x2="450" y2="758" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="462" y="748" font-size="11" fill="#555">NO</text>

  <!-- stop-loss diamond -->
  <polygon points="450,758 570,790 450,822 330,790" fill="#e67e22" stroke="#ca6f1e" stroke-width="1.5"/>
  <text x="450" y="786" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Stop-loss</text>
  <text x="450" y="802" text-anchor="middle" font-size="12" fill="white" font-weight="bold">hit?</text>

  <!-- yes branch left -->
  <line x1="330" y1="790" x2="200" y2="790" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="260" y="783" text-anchor="middle" font-size="11" fill="#e67e22">YES</text>
  <rect x="90" y="768" width="112" height="44" rx="8" fill="#e67e22" stroke="#ca6f1e" stroke-width="1.5"/>
  <text x="146" y="787" text-anchor="middle" font-size="12" fill="white" font-weight="bold">CLOSE</text>
  <text x="146" y="802" text-anchor="middle" font-size="11" fill="white">"stop-loss"</text>

  <!-- no branch -->
  <line x1="450" y1="822" x2="450" y2="846" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="462" y="836" font-size="11" fill="#555">NO</text>

  <!-- signal diamond -->
  <polygon points="450,846 570,878 450,910 330,878" fill="#1abc9c" stroke="#148f77" stroke-width="1.5"/>
  <text x="450" y="875" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Signal?</text>

  <!-- enter branch right -->
  <line x1="570" y1="878" x2="680" y2="878" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow-grn)"/>
  <text x="621" y="870" text-anchor="middle" font-size="11" fill="#27ae60">"enter"</text>

  <!-- max open diamond -->
  <polygon points="740,878 820,904 740,930 660,904" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="740" y="900" text-anchor="middle" font-size="11" fill="white">max</text>
  <text x="740" y="914" text-anchor="middle" font-size="11" fill="white">open ok?</text>

  <!-- yes buy -->
  <line x1="740" y1="930" x2="740" y2="954" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow-grn)"/>
  <text x="752" y="945" font-size="11" fill="#27ae60">YES</text>
  <rect x="672" y="954" width="136" height="52" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="740" y="974" text-anchor="middle" font-size="12" fill="white" font-weight="bold">broker.buy()</text>
  <text x="740" y="990" text-anchor="middle" font-size="11" fill="white">stake = 2% equity</text>
  <text x="740" y="1004" text-anchor="middle" font-size="11" fill="white">set stop below entry</text>

  <!-- notify buy -->
  <line x1="740" y1="1006" x2="740" y2="1030" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="672" y="1030" width="136" height="30" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
  <text x="740" y="1050" text-anchor="middle" font-size="11" fill="#27ae60">notify("BUY …")</text>

  <!-- no skip -->
  <line x1="820" y1="904" x2="870" y2="904" stroke="#aab7b8" stroke-width="1.5"/>
  <text x="848" y="897" text-anchor="middle" font-size="10" fill="#aab7b8">NO</text>
  <text x="870" y="910" font-size="10" fill="#aab7b8">skip</text>

  <!-- exit branch left -->
  <line x1="330" y1="878" x2="200" y2="878" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="260" y="870" text-anchor="middle" font-size="11" fill="#c0392b">"exit"</text>
  <rect x="90" y="856" width="112" height="44" rx="8" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>
  <text x="146" y="875" text-anchor="middle" font-size="12" fill="white" font-weight="bold">broker.close()</text>
  <text x="146" y="890" text-anchor="middle" font-size="11" fill="white">"exit signal"</text>
  <!-- notify sell -->
  <line x1="146" y1="900" x2="146" y2="924" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="924" width="132" height="30" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.2"/>
  <text x="146" y="944" text-anchor="middle" font-size="11" fill="#c0392b">notify("SELL …")</text>

  <!-- none branch -->
  <line x1="450" y1="910" x2="450" y2="934" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="462" y="924" font-size="11" fill="#555">none</text>
  <rect x="360" y="934" width="180" height="30" rx="6" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.2"/>
  <text x="450" y="953" text-anchor="middle" font-size="11" fill="#7f8c8d">hold — do nothing</text>

  <!-- ===== PERSIST ===== -->
  <line x1="450" y1="964" x2="450" y2="988" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="300" y="988" width="300" height="50" rx="8" fill="#8e44ad" stroke="#6c3483" stroke-width="1.5"/>
  <text x="450" y="1008" text-anchor="middle" font-size="13" fill="white" font-weight="bold">StateStore.persist()</text>
  <text x="450" y="1025" text-anchor="middle" font-size="11" fill="#d7bde2">save risk state + stops → state.json</text>

  <line x1="450" y1="1038" x2="450" y2="1062" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- sleep -->
  <rect x="330" y="1062" width="240" height="44" rx="8" fill="#566573" stroke="#424949" stroke-width="1.5"/>
  <text x="450" y="1082" text-anchor="middle" font-size="13" fill="white" font-weight="bold">sleep(timeframe)</text>
  <text x="450" y="1098" text-anchor="middle" font-size="11" fill="#aab7b8">e.g. 3600 s for --timeframe 1h</text>

  <!-- loop arrow back up -->
  <line x1="330" y1="1084" x2="240" y2="1084" stroke="#1abc9c" stroke-width="1.8"/>
  <line x1="240" y1="1084" x2="240" y2="354" stroke="#1abc9c" stroke-width="1.8"/>

  <!-- ===== BACKTESTER note ===== -->
  <rect x="80" y="1120" width="740" height="80" rx="8" fill="#fdfefe" stroke="#aab7b8" stroke-width="1.2"/>
  <text x="450" y="1142" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">backtester.py  (offline research tool — run BEFORE live)</text>
  <text x="450" y="1162" text-anchor="middle" font-size="11" fill="#555">  python backtester.py --symbol BTC/USDT --candles 3000   |   python backtester.py --synthetic  </text>
  <text x="450" y="1180" text-anchor="middle" font-size="11" fill="#555">Vectorised backtest: trend / meanrev / breakout vs Buy &amp; Hold.  Reports return, MaxDD, win rate, profit factor.</text>
  <text x="450" y="1196" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">A good backtest means "worth a tiny demo test", never "this prints money".</text>

  <!-- ===== LEGEND ===== -->
  <rect x="80" y="1218" width="740" height="170" rx="8" fill="#fdfefe" stroke="#aab7b8" stroke-width="1.2"/>
  <text x="450" y="1240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Colour Legend &amp; Key Modules</text>
  <!-- items -->
  <rect x="100" y="1252" width="18" height="14" fill="#2c3e50" rx="3"/>
  <text x="126" y="1264" font-size="11" fill="#2c3e50">Entry point / main control (run.py)</text>
  <rect x="300" y="1252" width="18" height="14" fill="#1a5276" rx="3"/>
  <text x="326" y="1264" font-size="11" fill="#1a5276">LiveTrader loop (bot/live.py)</text>
  <rect x="520" y="1252" width="18" height="14" fill="#1abc9c" rx="3"/>
  <text x="546" y="1264" font-size="11" fill="#1abc9c">Venue.tick / Engine.step (bot/engine.py)</text>

  <rect x="100" y="1278" width="18" height="14" fill="#d35400" rx="3"/>
  <text x="126" y="1290" font-size="11" fill="#d35400">Strategies (bot/strategies.py)</text>
  <rect x="300" y="1278" width="18" height="14" fill="#e74c3c" rx="3"/>
  <text x="326" y="1290" font-size="11" fill="#e74c3c">Risk / Kill-switch (bot/risk.py)</text>
  <rect x="520" y="1278" width="18" height="14" fill="#8e44ad" rx="3"/>
  <text x="546" y="1290" font-size="11" fill="#8e44ad">State persistence (bot/state.py)</text>

  <rect x="100" y="1304" width="18" height="14" fill="#2980b9" rx="3"/>
  <text x="126" y="1316" font-size="11" fill="#2980b9">Brokers: CcxtBroker / IGBroker (live)</text>
  <rect x="300" y="1304" width="18" height="14" fill="#27ae60" rx="3"/>
  <text x="326" y="1316" font-size="11" fill="#27ae60">PaperBroker (paper) / BUY action</text>
  <rect x="520" y="1304" width="18" height="14" fill="#566573" rx="3"/>
  <text x="546" y="1316" font-size="11" fill="#566573">Sleep / cadence</text>

  <text x="450" y="1360" text-anchor="middle" font-size="11" fill="#555">Dashed lines = side-effects (alerts, persistence) that never block the trading loop</text>
  <line x1="160" y1="1352" x2="280" y2="1352" stroke="#555" stroke-dasharray="6,3" stroke-width="1.2"/>
  <line x1="620" y1="1352" x2="740" y2="1352" stroke="#555" stroke-dasharray="6,3" stroke-width="1.2"/>

  <text x="450" y="1410" text-anchor="middle" font-size="10" fill="#aab7b8">personal-trader bot · claude/stoic-tesla-un2s8b</text>
</svg>